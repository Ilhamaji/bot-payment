name: Ping Supabase to Prevent Auto-Pause

on:
  schedule:
    # Menjalankan cron setiap 2 hari sekali pada jam 00:00 UTC
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping & Keep-Alive Supabase (Read/Write/Delete)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          echo "Memulai proses Keep-Alive Supabase..."
          if [ -z "$SUPABASE_URL" ]; then
            echo "Error: Secrets SUPABASE_URL belum diisi di GitHub Repository Secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Secrets SUPABASE_KEY belum diisi di GitHub Repository Secrets."
            exit 1
          fi

          # Clean URL trailing slash
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's#/$##')
          DUMMY_ORDER_ID="PING-KEEP-ALIVE-000"

          # 1. READ PING (Membaca 1 baris transaksi di tabel purchases)
          echo "--- 1. Melakukan READ Ping ---"
          echo "Target URL: ${CLEAN_URL}/rest/v1/purchases?select=order_id&limit=1"

          HTTP_STATUS=$(curl -s -o read_resp.json -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/purchases?select=order_id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json")

          echo "READ HTTP Status: $HTTP_STATUS"
          cat read_resp.json || true
          echo ""

          # 2. WRITE/INSERT DUMMY DATA (Menambah 1 transaksi dummy untuk memicu aktivitas write)
          echo "--- 2. Menambahkan Data Dummy (WRITE) ---"
          INSERT_STATUS=$(curl -s -o insert_resp.json -w "%{http_code}" -X POST "${CLEAN_URL}/rest/v1/purchases" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"order_id\": \"$DUMMY_ORDER_ID\", \"roblox_username\": \"ping_user\", \"discord_username\": \"ping_bot\", \"item_name\": \"Keep Alive Ping\", \"price\": 0, \"status\": \"ping\"}")

          echo "INSERT HTTP Status: $INSERT_STATUS"
          cat insert_resp.json || true
          echo ""

          # 3. DELETE DUMMY DATA (Menghapus kembali data dummy yang baru ditambahkan)
          echo "--- 3. Menghapus Data Dummy (DELETE) ---"
          DELETE_STATUS=$(curl -s -o delete_resp.json -w "%{http_code}" -X DELETE "${CLEAN_URL}/rest/v1/purchases?order_id=eq.${DUMMY_ORDER_ID}" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "DELETE HTTP Status: $DELETE_STATUS"
          cat delete_resp.json || true
          echo ""

          echo "Proses Keep-Alive Supabase selesai dijalankan."

          # Verifikasi keberhasilan operasi REST API
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$INSERT_STATUS" -eq 201 ] || [ "$DELETE_STATUS" -eq 200 ] || [ "$DELETE_STATUS" -eq 204 ]; then
            echo "✅ Aktivitas database berhasil didaftarkan ke Supabase."
          else
            echo "❌ Error: Seluruh operasi REST API Supabase gagal (Periksa Secrets SUPABASE_URL / SUPABASE_KEY)."
            exit 1
          fi
